apis:
- name: P4 Plan (Hansoft) GraphQL API
  description: >-
    GraphQL API service for P4 Plan (Hansoft) exposing 60+ queries, 100+
    mutations, and 50+ subscriptions across projects, items (tasks, bugs,
    backlog), users and groups, sprints, timesheets, reports, dashboards,
    custom fields, and webhooks. Authenticates via a login mutation. Runs as a
    service against a customer-hosted P4 Plan server.
  humanURL: https://help.perforce.com/hansoft/current/Content/hansoftapi/index.html
  tags:
  - GraphQL
  - Project Management
  properties:
  - type: APIReference
    url: https://help.perforce.com/hansoft/current/Content/hansoftapi/index.html
  - type: GraphQL
    url: https://help.perforce.com/hansoft/current/Content/hansoftapi/index.html
- name: P4 Plan (Hansoft) SDK
  description: >-
    Native P4 Plan (Hansoft) SDK with C, C++, Java, and .NET wrappers
    auto-generated from C headers. Provides session management, resource and
    project operations, workflow configuration, custom columns/fields, and
    dashboard/reporting access against a customer-hosted server.
  humanURL: https://help.perforce.com/hansoft/sdk/index.html
  tags:
  - SDK
- name: P4 Plan (Hansoft) Web API
  description: >-
    Web service exposing a limited set of data and tasks over the DDP protocol
    via a WebSocket connection.
  humanURL: https://help.perforce.com/hansoft/10.2/api/index.html
  tags:
  - WebSocket
