name: Hansoft
description: >-
  Hansoft, now branded P4 Plan by Perforce, is a real-time agile project
  planning and portfolio management tool for software, game, and hardware teams.
  It lets multiple teams work in their preferred methodology simultaneously
  (Scrum, Kanban, and Gantt) within a single backlog, with field-level
  permissions, capacity and resource planning, sprint and burndown reporting,
  and tight integration with Perforce version control (P4 changelists). For
  developers it exposes a GraphQL API service (queries, mutations, and
  subscriptions), a native SDK with C, C++, Java, and .NET wrappers, a WebSocket
  Web API, and outbound webhooks for integrations such as Jira. Hansoft is
  deployed on-premises for security-conscious organizations, so its API and SDK
  run against a customer-hosted P4 Plan server.
